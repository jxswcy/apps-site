<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jxswcy Apps</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --fg: #171717;
      --muted: #66645f;
      --card: #ffffff;
      --line: #dedbd3;
      --accent: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --fg: #f4f2ec;
        --muted: #aaa59a;
        --card: #1a1917;
        --line: #34312c;
        --accent: #7aa7ff;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.15;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    .card {
      margin-top: 32px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>jxswcy Apps</h1>
    <p>Support and policy pages for apps by jxswcy.</p>

    <section class="card">
      <h2>NuFeed</h2>
      <p>An RSS and web subscription reader for iPhone, iPad, and Mac.</p>
      <div class="links">
        <a href="./nufeed/">Overview</a>
        <a href="./nufeed/privacy.html">Privacy Policy</a>
        <a href="./nufeed/support.html">Support</a>
      </div>
    </section>
  </main>
</body>
</html>
